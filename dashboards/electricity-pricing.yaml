views:
  - type: sections
    title: Overview
    path: electricityinfo
    icon: mdi:binoculars
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: 32
              rows: 8
            header:
              show: true
              title: ROS0221 Electricity Price (c/kWh)
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: hour
              offset: -24h
            now:
              show: true
              label: now
              color: red
            series:
              - entity: sensor.ros0221_c_kwh_settled_price
                name: Interim
                type: column
                show:
                  in_header: false
                  legend_value: false
                stroke_width: 2
                opacity: 0.9
                data_generator: |
                  return (entity.attributes.history || []).map(h => [
                    new Date(h.period_start).getTime(),
                    Number(h.price)
                  ]);
              - entity: sensor.ros0221_c_kwh_day_ahead_forecast
                name: History
                type: column
                show:
                  in_header: false
                  legend_value: false
                stroke_width: 2
                opacity: 0.5
                data_generator: |
                  return (entity.attributes.history || []).map(h => [
                    new Date(h.period_start).getTime(),
                    Number(h.price)
                  ]);
              - entity: sensor.ros0221_c_kwh_day_ahead_forecast
                name: Forecast
                type: column
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  return (entity.attributes.forecast || []).map(f => [
                    new Date(f.period_start).getTime(),
                    Number(f.price)
                  ]);
              - entity: sensor.ros0221_c_kwh_day_ahead_forecast
                name: Current
                unit: ' c/kWh'
                float_precision: 3
                show:
                  in_chart: false
                  in_header: true
            yaxis:
              - min: ~0
                decimals: 3
          - type: tile
            entity: sensor.ros0221_c_kwh_live_price
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.ros0221_c_kwh_settled_price
            vertical: false
            features:
              - type: trend-graph
            features_position: bottom
          - type: tile
            entity: sensor.em6_spot_power_price_nzc
            features:
              - type: trend-graph
          - type: history-graph
            entities:
              - entity: sensor.ros0221_c_kwh_settled_price
              - entity: sensor.ota2201_c_kwh_settled_price
            hours_to_show: 24
          - type: history-graph
            entities:
              - entity: sensor.ota2201_c_kwh_day_ahead_forecast
              - entity: sensor.ros0221_c_kwh_day_ahead_forecast
            hours_to_show: 24
        column_span: 2
  - type: sections
    title: Pricing
    path: electricity-pricing
    icon: mdi:transmission-tower
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Settled pricing
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.vector_peak_period
                name: Peak now
          - type: tile
            entity: sensor.electricity_import_price
            name: Import price
          - type: tile
            entity: sensor.electricity_export_price
            name: Export price
          - type: entities
            title: Price breakdown
            entities:
              - entity: sensor.ros0221_c_kwh_settled_price
                name: Wholesale (settled, c/kWh)
              - entity: sensor.electricity_spot_price
                name: Wholesale (NZD/kWh)
              - entity: sensor.electricity_import_price
                name: Import price
              - entity: sensor.electricity_export_price
                name: Export price
              - entity: sensor.electricity_fixed_daily_charge
                name: Fixed daily charge
          - type: history-graph
            title: Import / export price today
            hours_to_show: 24
            entities:
              - sensor.electricity_import_price
              - sensor.electricity_export_price
      - type: grid
        cards:
          - type: heading
            heading: Today
            heading_style: title
          - type: tile
            entity: sensor.grid_import_daily
            name: Import kWh
          - type: tile
            entity: sensor.grid_export_daily
            name: Export kWh
          - type: tile
            entity: sensor.grid_import_cost_daily
            name: Cost today
          - type: tile
            entity: sensor.grid_export_earnings_daily
            name: Earnings today
      - type: grid
        cards:
          - type: heading
            heading: Current billing cycle
            heading_style: title
          - type: tile
            entity: sensor.grid_import_billing_peak
            name: Import — peak
          - type: tile
            entity: sensor.grid_import_billing_offpeak
            name: Import — off-peak
          - type: tile
            entity: sensor.grid_export_billing_peak
            name: Export — peak
          - type: tile
            entity: sensor.grid_export_billing_offpeak
            name: Export — off-peak
          - type: entities
            title: Billing cycle cost
            entities:
              - entity: sensor.grid_import_cost_billing
                name: Import cost
              - entity: sensor.grid_export_earnings_billing
                name: Export earnings
              - entity: select.grid_import_billing
                name: Import tariff (current)
              - entity: select.grid_export_billing
                name: Export tariff (current)
          - type: history-graph
            title: Cumulative cost / earnings this cycle
            hours_to_show: 720
            entities:
              - entity: sensor.grid_import_cost_billing
              - entity: sensor.grid_export_earnings_billing
  - type: sections
    title: Pricing v2
    path: electricity-pricing-v2
    icon: mdi:home-battery
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery grid-charge advisory
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: binary_sensor.battery_grid_charge_recommended
                name: Recommended
                tap_action:
                  action: more-info
              - type: entity
                entity: binary_sensor.battery_charge_window_active
                tap_action:
                  action: more-info
          - type: tile
            entity: sensor.battery_energy_needed
            name: Battery needs
          - type: tile
            entity: sensor.overnight_charge_window_price
            name: Forecast overnight price
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.al2002118050331_instantaneous_battery_soc
            name: Battery SOC
          - type: tile
            entity: switch.al2002118050331_grid_charge_enabled
            name: Grid charge switch
          - type: tile
            entity: input_number.battery_charge_price_threshold
            name: 'Price threshold '
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: input_number.battery_charge_solar_threshold
            name: Solar threshold
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: input_number.battery_overnight_charge_cap
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: tile
            entity: input_number.battery_normal_charge_cap
            vertical: false
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
          - type: entities
            title: Solar forecasts
            entities:
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Solcast (tomorrow)
              - entity: sensor.helios_forecast_energy_day_2
                name: Helios (tomorrow)
              - entity: sensor.energy_production_tomorrow
                name: Forecast.Solar (tomorrow)
              - entity: sensor.solar_forecast_next_daylight
                name: Used for charging (minimum)
              - type: attribute
                entity: sensor.solar_forecast_next_daylight
                attribute: day
                name: Forecast day used
      - type: grid
        cards:
          - type: heading
            heading: Solar forecast accuracy
            heading_style: title
          - type: history-graph
            title: Forecast vs actual production (14 days)
            hours_to_show: 336
            entities:
              - input_number.solcast_forecast_snapshot
              - input_number.helios_forecast_snapshot
              - input_number.forecast_solar_snapshot
              - sensor.al2002118050331_daily_pv_generation
          - type: history-graph
            title: Daily accuracy %
            hours_to_show: 720
            entities:
              - sensor.solcast_forecast_accuracy
              - sensor.helios_forecast_accuracy
              - sensor.forecast_solar_accuracy
      - type: grid
        cards:
          - type: heading
            heading: Price forecast
            heading_style: title
          - type: entities
            title: Price forecast accuracy
            entities:
              - entity: sensor.overnight_price_forecast_accuracy
                name: Overnight window error
              - entity: sensor.peak_export_price_forecast_accuracy
                name: Peak export window error
              - entity: sensor.actual_overnight_window_price
                name: Actual overnight price
              - entity: sensor.actual_peak_export_window_price
                name: Actual peak export price
          - type: history-graph
            title: Overnight price — forecast vs actual (14 days)
            hours_to_show: 336
            entities:
              - input_number.overnight_price_forecast_snapshot
              - sensor.actual_overnight_window_price
  - type: sections
    title: EMHASS
    path: emhass
    icon: mdi:chart-timeline-variant
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Planned power
            heading_style: title
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: 24
              rows: 7
            graph_span: 24h
            span:
              start: minute
            now:
              show: true
              label: now
              color: red
            header:
              show: true
              show_states: false
            yaxis:
              - decimals: 0
            series:
              - entity: sensor.p_pv_forecast
                name: PV
                unit: W
                curve: stepline
                stroke_width: 2
                data_generator: |
                  return (entity.attributes.forecasts || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.p_pv_forecast)
                  ]);
              - entity: sensor.p_load_forecast
                name: Load
                unit: W
                curve: stepline
                stroke_width: 2
                data_generator: |
                  return (entity.attributes.forecasts || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.p_load_forecast)
                  ]);
              - entity: sensor.p_batt_forecast
                name: Battery (+ discharge)
                unit: W
                curve: stepline
                stroke_width: 2
                data_generator: >
                  return (entity.attributes.battery_scheduled_power || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.p_batt_forecast)
                  ]);
              - entity: sensor.p_grid_forecast
                name: Grid (+ import)
                unit: W
                curve: stepline
                stroke_width: 2
                data_generator: |
                  return (entity.attributes.forecasts || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.p_grid_forecast)
                  ]);
      - type: grid
        cards:
          - type: heading
            heading: Optimisation
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.emhass_grid_charge_planned
                name: Grid charge
                tap_action:
                  action: more-info
              - type: entity
                entity: automation.emhass_optimise_and_publish
                name: Last run
                state_content: last_triggered
          - type: tile
            entity: sensor.optim_status
            name: Status
          - type: tile
            entity: sensor.emhass_plan_value
            name: Plan value
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.p_batt_forecast
            name: Battery now (+ discharge)
          - type: tile
            entity: sensor.soc_batt_forecast
            name: Planned SOC
          - type: tile
            entity: sensor.p_grid_forecast
            name: Grid now (+ import)
          - type: tile
            entity: sensor.al2002118050331_instantaneous_battery_soc
            name: Actual SOC
          - type: tile
            entity: sensor.emhass_import_price
            name: Import price
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.emhass_export_price
            name: Export price
            vertical: false
            features_position: bottom
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Planned SOC and prices
            heading_style: title
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: 24
              rows: 7
            graph_span: 24h
            span:
              start: minute
            now:
              show: true
              label: now
              color: red
            header:
              show: true
              show_states: false
            yaxis:
              - id: soc
                min: 0
                max: 100
                decimals: 0
              - id: price
                opposite: true
                min: ~0
                decimals: 2
            series:
              - entity: sensor.soc_batt_forecast
                name: SOC
                unit: '%'
                yaxis_id: soc
                type: area
                opacity: 0.3
                stroke_width: 2
                data_generator: >
                  return (entity.attributes.battery_scheduled_soc || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.soc_batt_forecast)
                  ]);
              - entity: sensor.unit_load_cost
                name: Import price
                unit: NZD/kWh
                yaxis_id: price
                curve: stepline
                stroke_width: 2
                data_generator: >
                  return (entity.attributes.unit_load_cost_forecasts || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.unit_load_cost)
                  ]);
              - entity: sensor.unit_prod_price
                name: Export price
                unit: NZD/kWh
                yaxis_id: price
                curve: stepline
                stroke_width: 2
                data_generator: >
                  return (entity.attributes.unit_prod_price_forecasts || []).map(f => [
                    new Date(f.date).getTime(),
                    Number(f.unit_prod_price)
                  ]);
